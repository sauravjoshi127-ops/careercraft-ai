<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - CareerCraft AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app-sdk.js"></script>
    <script src="layout-manager.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-wrapper {
            width: 100%;
            max-width: 420px;
            margin: 6rem auto 4rem;
            display: none;
            position: relative;
            z-index: 10;
        }
        .auth-wrapper.show {
            display: block;
            animation: fadeInUp 0.5s ease-out forwards;
        }
        .auth-wrapper h1 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            text-align: center;
            color: var(--text-2);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .remember {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            font-size: 0.88rem;
            color: var(--text-2);
        }
        .remember a {
            color: var(--text-1);
            text-decoration: none;
            font-weight: 500;
        }
        .remember a:hover {
            color: var(--accent);
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: var(--text-3);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
        .divider::before { margin-right: 1rem; }
        .divider::after { margin-left: 1rem; }
        .social-login {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .social-btn {
            flex: 1;
            padding: 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            color: var(--text-1);
            cursor: pointer;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 500;
            transition: border-color var(--t-fast), box-shadow var(--t-fast);
        }
        .social-btn:hover {
            background: var(--bg-hover);
            border-color: var(--border-hover);
        }
        .auth-link {
            text-align: center;
            color: var(--text-2);
            font-size: 0.88rem;
            margin-top: 1.5rem;
        }
        .auth-link a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-link a:hover {
            color: var(--accent-hover);
        }
        .error-msg, .success-msg {
            padding: 0.875rem 1rem;
            border-radius: var(--r-sm);
            margin-bottom: 1.5rem;
            display: none;
            font-size: 0.88rem;
            font-weight: 500;
        }
        .error-msg { background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }
        .success-msg { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
    </style>
    <script src="auth-manager.js" defer></script>
    <script src="password-toggle.js" defer></script>
    <link rel="stylesheet" href="styles/premium.css">
</head>
<body>



    <!-- Top Navigation — rendered by NavigationManager -->
    <nav class="ch-nav" aria-label="Main navigation"></nav>

    <div id="loadingState" style="text-align: center; margin-top: 10rem; color: var(--text-2);">
        <h2>Loading sign-in...</h2>
    </div>

    <div class="auth-wrapper glass-card" id="authWrapper">
        <h1>Sign In</h1>
        <p class="subtitle">Welcome back! Sign in to your account.</p>

        <div id="errorMsg" class="error-msg"></div>
        <div id="successMsg" class="success-msg"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="remember">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: 400;">
                    <input type="checkbox" style="width: auto;"> Remember me
                </label>
                <a href="reset-password.html">Forgot password?</a>
            </div>

            <button type="submit" class="btn-primary" id="submitBtn" style="width: 100%; padding: 0.95rem;">Sign In</button>
        </form>

        <div class="divider">Or continue with</div>

        <div class="social-login">
            <button class="social-btn" type="button" onclick="handleOAuthLogin(event, 'google')">Google</button>
            <button class="social-btn" type="button" onclick="handleOAuthLogin(event, 'github')">GitHub</button>
        </div>

        <p class="auth-link">
            Don't have an account? <a href="signup.html">Sign up free</a>
        </p>
    </div>

    <script>
        // Use unified Client SDK
        let client = null;

        function showMessage(node, message) {
            node.textContent = message;
            node.style.display = 'block';
        }

        function getFriendlyAuthError(error) {
            const message = String(error?.message || error || '').trim();
            const lower = message.toLowerCase();

            if (!client) {
                return 'Sign-in service is temporarily unavailable.';
            }

            if (!navigator.onLine || lower.includes('failed to fetch') || lower.includes('networkerror') || lower.includes('load failed') || lower.includes('timeout')) {
                return 'Sign-in service is temporarily unavailable.';
            }

            if (lower.includes('invalid login credentials')) {
                return 'Incorrect email or password.';
            }

            if (lower.includes('email not confirmed')) {
                return 'Please confirm your email before signing in.';
            }

            return 'Sign-in service is temporarily unavailable.';
        }

        // Redirect if already logged in (hidden initially to prevent FOUC glitch)
        async function checkExistingSession() {
            const loadingState = document.getElementById('loadingState');
            const authWrapper = document.getElementById('authWrapper');
            const urlParams = new URLSearchParams(window.location.search);
            const hasError = urlParams.has('error') || urlParams.has('loop');

            try {
                // Add explicit timeout to avoid indefinite blank screen
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000));
                await Promise.race([window.appSdk.ready, timeoutPromise]);
                client = window.appSdk.client;
            } catch (err) {
                console.error('Session/Config check error:', err);
                client = null;
            }

            try {
                // Wait for session resolution. If client is null, getSession() handles it gracefully returning null.
                const session = await window.appSdk.auth.getSession();
                
                if (session && !hasError) {
                    // Check for redirect param
                    const redirect = urlParams.get('redirect') || 'dashboard.html';
                    window.location.href = redirect;
                    return; // Return early, leaving the loading UI visible while page navigates away
                } else {
                    if (hasError && session && client) {
                        console.warn('Redirect loop detected. Clearing session.');
                        await client.auth.signOut().catch(() => {});
                        localStorage.clear();
                    }
                }
            } catch (err) {
                console.error('Session retrieve error:', err);
            }

            loadingState.style.display = 'none';
            authWrapper.classList.add('show');
            
            if (!client) {
                showMessage(document.getElementById('errorMsg'), 'Sign-in service is temporarily unavailable.');
                document.getElementById('submitBtn').disabled = true;
            }
        }
        checkExistingSession();

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            // Reset messages
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (!email || !password) {
                showMessage(errorMsg, 'Please enter your email and password.');
                return;
            }

            if (!client) {
                showMessage(errorMsg, getFriendlyAuthError());
                return;
            }

            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            try {
                // Use Supabase Auth to sign in (session persisted automatically)
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    console.error('[Supabase Auth Failure]', {
                        message: error.message,
                        name: error.name,
                        status: error.status,
                        code: error.code || 'N/A'
                    });
                    throw error;
                }

                if (!data.user) {
                    throw new Error('No user returned from authentication');
                }

                const name = data.user.user_metadata?.full_name || email.split('@')[0];

                // Success! Keep localStorage in sync for fallback
                showMessage(successMsg, 'Signed in successfully. Redirecting...');

                localStorage.setItem('userEmail', email);
                localStorage.setItem('userName', name);
                localStorage.setItem('userId', data.user.id);
                localStorage.setItem('userToken', data.session.access_token);
                sessionStorage.removeItem('signup_verification_required');

                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                const message = getFriendlyAuthError(error);
                showMessage(errorMsg, message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        }

        async function handleOAuthLogin(event, provider) {
            event.preventDefault();
            const btn = event.currentTarget;
            if (btn.disabled) return;
            
            const originalText = btn.textContent;
            
            const allSocialBtns = document.querySelectorAll('.social-btn');
            allSocialBtns.forEach(b => b.disabled = true);
            
            btn.textContent = 'Connecting...';
            
            const errorMsg = document.getElementById('errorMsg');
            if(errorMsg) errorMsg.style.display = 'none';
            
            try {
                if (!window.appSdk || !window.appSdk.client) {
                    await window.appSdk.ready;
                }
                await window.appSdk.auth.oauthLogin(provider);
            } catch (err) {
                if(errorMsg) showMessage(errorMsg, `${provider === 'github' ? 'GitHub' : 'Google'} sign-in could not be completed. Please try again.`);
                allSocialBtns.forEach(b => b.disabled = false);
                btn.textContent = originalText;
            }
        }
    </script>
</body>
</html>
